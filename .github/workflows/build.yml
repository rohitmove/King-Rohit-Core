name: Build King Rohit Core .so

on: [push]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout Repository
            uses: actions/checkout@v4

          - name: Download and Setup NDK
            run: |
              echo "Downloading Android NDK r23b..."
              wget -q https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
              unzip -q android-ndk-r23b-linux.zip
              echo "ANDROID_NDK_HOME=$PWD/android-ndk-r23b" >> $GITHUB_ENV

          - name: Compile Library with CMake
            run: |
              mkdir -p build && cd build
              cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                    -DANDROID_ABI=arm64-v8a \
                    -DANDROID_PLATFORM=android-21 \
                    -DCMAKE_CXX_FLAGS="-I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include" \
                    ..
              make

          - name: Upload Artifact
            uses: actions/upload-artifact@v4
            with:
              name: libkingrohitcore.so
              path: build/libkingrohitcore.so
